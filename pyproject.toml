[project]
name = "relevan"
version = "0.1.0"
description = "Python client for the Relevan search API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Relevan" }]
keywords = ["relevan", "search", "api", "client", "agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "attrs>=23.2"]

[project.urls]
Homepage = "https://relevan.dev"
Documentation = "https://github.com/relevan-dev/relevan-python#readme"
Repository = "https://github.com/relevan-dev/relevan-python"
Issues = "https://github.com/relevan-dev/relevan-python/issues"
Changelog = "https://github.com/relevan-dev/relevan-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "openapi-python-client>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relevan"]

[tool.hatch.build.targets.sdist]
include = ["src/relevan", "tests", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/relevan/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
exclude = ["src/relevan/_generated"]

[[tool.mypy.overrides]]
module = "relevan._generated.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
